# Builds the Astro site and publishes it to GitHub Pages.
# Runs on every push to main, once a day (to refresh chess ratings), and on demand.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * *'   # every day at 09:17 UTC (03:17 in Mexico City)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses package-lock.json when it exists (faster, reproducible).
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
